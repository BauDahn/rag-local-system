models:
  embedding: "BAAI/bge-small-en-v1.5"        # Light embedding model (English)
  embedding_device: "cpu"                    # "cpu" or "cuda" (4 GB VRAM: keep it free for the LLM)
  reranker: "BAAI/bge-reranker-base"         # Cross-encoder that re-scores the fused candidates
  reranker_device: "cpu"                     # "cpu" or "cuda"
  llm: "qwen2.5:3b-instruct"                 # Ollama model tag (`ollama pull <tag>`); fits in 4 GB VRAM

ollama:
  host: "http://localhost:11434"
  timeout: 120                               # Seconds to wait for a generation

parameters:
  chunk_size: 512
  chunk_overlap: 50
  min_letters: 120                           # Drop chunks with fewer alphabetic characters than this
  temperature: 0                             # 0 = deterministic (best for faithfulness)
  k_candidates: 20                           # Candidates taken from each retriever (dense and BM25)
  top_k: 4                                   # Chunks passed to the LLM after reranking
  rrf_k: 60                                  # Reciprocal Rank Fusion constant
  min_rerank_score: null                     # Drop chunks scoring below this (null = off; calibrate with evaluate)
  max_new_tokens: 300

prompts:
  template: "qa"                             # File name (without .md) in src/rag/prompts/
  fallback: "I do not know based on the provided documents."

paths:
  raw_data: "data/raw/"
  vector_store: "data/vector_db/"            # Holds the Chroma DB, the BM25 index and manifest.json
