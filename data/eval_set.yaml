- question: "Who won the 2018 football World Cup?"
  answerable: false
- question: "What is the name of the narrator's mother?"
  answerable: false
- question: "Which university did the narrator graduate from?"
  answerable: false
- question: "What is the name of the fox?"
  answerable: false
- question: "What is the speed of light?"
  answerable: false
- question: "Who painted the Mona Lisa?"
  answerable: false
- question: "How much does the little prince's rose cost?"
  answerable: false
