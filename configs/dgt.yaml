# Perfil para el corpus de la DGT (texto legal en español).
# Uso: python main.py --config configs/dgt.yaml --mode ingest|query|eval|ui
# Las rutas relativas se resuelven contra la RAÍZ del proyecto.
models:
  embedding: "BAAI/bge-m3"                   # Multilingüe
  embedding_device: "cpu"
  reranker: "BAAI/bge-reranker-v2-m3"        # Multilingüe
  reranker_device: "cpu"
  llm_backend: "ollama"
  llm: "qwen2.5:7b-instruct"

ollama:
  host: "http://localhost:11434"
  timeout: 180

parameters:
  chunk_size: 800                            # Texto legal: artículos largos, más contexto por fragmento
  chunk_overlap: 100
  min_letters: 120
  temperature: 0
  k_candidates: 20
  top_k: 4
  rrf_k: 60
  min_rerank_score: null
  max_new_tokens: 400

prompts:
  template: "qa_es"
  fallback: "No lo sé con base en los documentos proporcionados."

paths:
  raw_data: "data/corpora/dgt/raw"
  vector_store: "data/corpora/dgt/vector_db"
  eval_set: "data/corpora/dgt/eval_set.yaml"
